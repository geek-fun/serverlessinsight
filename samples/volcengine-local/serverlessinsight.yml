version: 0.1.0
app: local-example
service: vefaas-http
provider:
  name: volcengine
  region: cn-beijing
stages:
  local:
    greeting: Hello from local veFaaS
functions:
  echo:
    name: local-vefaas-echo
    code:
      runtime: node20/v1
      handler: index.handler
      path: .
    timeout: 3
    environment:
      GREETING: ${stages.greeting}
      STAGE: ${ctx.stage}
events:
  api:
    type: API_GATEWAY
    name: local-vefaas-api
    triggers:
      - method: ANY
        path: /echo
        backend: ${functions.echo}
