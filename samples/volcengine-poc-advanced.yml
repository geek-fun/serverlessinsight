version: 0.1.0
provider:
  name: volcengine
  region: cn-beijing

app: insight-poc
service: insight-poc-advanced

functions:
  vpc_function:
    name: insight-poc-vpc-fn
    code:
      runtime: node20/v1
      handler: index.handler
      path: ./artifacts/function.zip
    memory: 512
    timeout: 60
    log: true
    network:
      vpc_id: vpc-xxx
      subnet_ids:
        - subnet-xxx
      security_group:
        name: fn-security-group
        ingress:
          - 'TCP:0.0.0.0/0:443'
        egress:
          - 'TCP:0.0.0.0/0:ALL'
    environment:
      DATABASE_URL: mysql://...
      REDIS_URL: redis://...

  basic_function:
    name: insight-poc-basic-fn
    code:
      runtime: python3.12/v1
      handler: main.handler
      path: ./artifacts/processor.zip
    memory: 256
    timeout: 30
    log: true
    environment:
      DEBUG: 'true'

events:
  api_gateway:
    type: API_GATEWAY
    name: insight-poc-api
    triggers:
      - method: GET
        path: /api/hello
        backend: ${functions.basic_function}
      - method: POST
        path: /api/process
        backend: ${functions.vpc_function}
