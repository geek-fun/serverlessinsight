name: release

on:
  push:
    branches: [master]

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Github checkout
        uses: actions/checkout@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          fetch-depth: 0 # Fetch all history including tags for version checking
      - name: Check for version change
        id: version_check
        run: ./scripts/check-version.sh . v
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.version_check.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        if: steps.version_check.outputs.should_release == 'true'
        run: npm ci
      - name: Lint
        if: steps.version_check.outputs.should_release == 'true'
        run: npm run lint:check
      - name: Audit dependencies
        if: steps.version_check.outputs.should_release == 'true'
        run: npm audit --audit-level=critical
      - name: build 🔧
        if: steps.version_check.outputs.should_release == 'true'
        run: npm run build
      - name: Test
        if: steps.version_check.outputs.should_release == 'true'
        run: npm run test:ci
      # Same transient-failure policy as node.yml: one soft attempt, then a
      # strict retry — a persistent upload failure still fails the release.
      - name: Upload coverage reports to Codecov
        if: steps.version_check.outputs.should_release == 'true'
        uses: codecov/codecov-action@v5
        id: codecov_upload
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true
      - name: Retry coverage upload to Codecov
        if: steps.version_check.outputs.should_release == 'true' && steps.codecov_upload.outcome == 'failure'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true
      - name: Build Release Notes
        if: steps.version_check.outputs.should_release == 'true'
        id: release_notes
        run: |
          bash scripts/build-release-notes.sh
          {
            echo 'release_body<<EOF'
            cat release-notes.md
            echo EOF
          } >> $GITHUB_OUTPUT
      - name: Publish package on NPM 📦
        if: steps.version_check.outputs.should_release == 'true'
        run: npm publish
      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version_check.outputs.tag_name }}
          name: ServerlessInsight ${{ steps.version_check.outputs.version }}
          body: ${{ steps.release_notes.outputs.release_body }}
