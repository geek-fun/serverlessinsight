name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Github checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:check
      - run: npm audit --audit-level=critical
      - run: npm run build
      - run: npm run test:ci
      # The codecov endpoint occasionally drops TLS handshakes (transient
      # EPROTO failures). The upload must still gate the job when it
      # persistently fails (fail_ci_if_error: true), so: first attempt is
      # soft, and an explicit retry re-runs the upload with strict failure —
      # only a persistent failure turns the run red.
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        id: codecov_upload
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true
      - name: Retry coverage upload to Codecov
        if: matrix.os == 'ubuntu-latest' && steps.codecov_upload.outcome == 'failure'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true

      - run: npm run build
