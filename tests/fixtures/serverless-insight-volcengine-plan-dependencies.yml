version: 0.0.1
app: volc-plan-dependencies-app
service: volc-plan-dependencies
provider:
  name: volcengine
  region: cn-beijing
backend:
  state_manager:
    type: LOCAL
functions:
  hello:
    name: volc-plan-hello
    code:
      runtime: node20/v1
      handler: index.handler
      path: tests/fixtures/artifacts/artifact.zip
    memory: 128
    timeout: 30
buckets:
  assets:
    name: volc-plan-assets
    security:
      acl: PRIVATE
events:
  http:
    name: volc-plan-http
    type: API_GATEWAY
    triggers:
      - method: GET
        path: /hello
        backend: ${functions.hello}
