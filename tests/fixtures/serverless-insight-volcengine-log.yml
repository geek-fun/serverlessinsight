version: 0.0.1
app: insight-volc-app
provider:
  name: volcengine
  region: cn-beijing

service: insight-volc

backend:
  state_manager:
    type: LOCAL

functions:
  insight_poc_fn:
    name: insight-poc-fn
    code:
      runtime: node20/v1
      handler: index.handler
      path: tests/fixtures/artifacts/artifact.zip
    memory: 128
    timeout: 30
    environment:
      NODE_ENV: production
    log: true
